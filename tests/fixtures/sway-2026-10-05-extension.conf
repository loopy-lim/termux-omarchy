# A real Linux Wayland desktop. Change bindings here, outside Android Activities.
set $mod Ctrl+Mod1
include /root/.config/loopy/modifier
set $term python3 /usr/local/lib/loopy/desktop_ui.py terminal
font pango:Noto Sans CJK KR 12
include /root/.config/loopy/theme
output * bg $background solid_color
input * xkb_layout us
input type:pointer natural_scroll enabled
xwayland disable
floating_modifier $mod normal
focus_follows_mouse yes
default_border pixel 2
gaps inner 8
gaps outer 8
client.focused $accent $surface $ink $accent $accent
client.unfocused $border $surface $muted $border $border
client.focused_inactive $border $surface $muted $border $border

bindsym $mod+Return exec $term
bindsym $mod+space exec /usr/local/bin/loopy-launcher
bindsym $mod+e exec python3 /usr/local/lib/loopy/desktop_ui.py files
bindsym $mod+Shift+e exec python3 /usr/local/lib/loopy/desktop_ui.py editor
bindsym $mod+Shift+b exec python3 /usr/local/lib/loopy/desktop_ui.py browser
bindsym $mod+Shift+c exec python3 /usr/local/lib/loopy/desktop_ui.py code-ide
bindsym $mod+Shift+t exec python3 /usr/local/lib/loopy/desktop_ui.py themes
bindsym $mod+w exec python3 /usr/local/lib/loopy/desktop_ui.py workspaces
bindsym $mod+Shift+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+Tab exec python3 /usr/local/lib/loopy/desktop_ui.py overview
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9

mode "resize" {
    bindsym h resize shrink width 24 px
    bindsym j resize grow height 24 px
    bindsym k resize shrink height 24 px
    bindsym l resize grow width 24 px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"
bar {
    position top
    font pango:Noto Sans CJK KR 12
    status_command /usr/local/bin/loopy-status
    colors {
        background $surface
        statusline $muted
        separator $border
        focused_workspace $accent $accent $background
        active_workspace $border $surface $ink
        inactive_workspace $surface $surface $muted
    }
}
exec /usr/local/bin/loopy-ready
exec /usr/local/bin/loopy-launcher
include /root/.config/sway/user.conf
