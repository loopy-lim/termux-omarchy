<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tablet Dev Lab</title>
<style>body{margin:0;background:#161b22;color:#e6edf3;font:18px system-ui;padding:32px}main{max-width:1000px;margin:auto}header{color:#79c0ff;font-size:14px}h1{font-size:32px}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:#21262d;padding:24px;border-radius:12px}input,button{font:inherit;padding:10px;border:1px solid #484f58;border-radius:6px;background:#0d1117;color:inherit}button{cursor:pointer}li{padding:8px}video{width:100%;background:black}small{color:#8b949e}#state{color:#7ee787}@media(max-width:700px){section{grid-template-columns:1fr}}</style>
<main><header>Y900 · LOCAL DEVELOPMENT</header><h1 id="message">Loading…</h1><p id="state">Connecting</p><section><article><h2>작업 메모</h2><form><input id="task" aria-label="새 작업" placeholder="작업을 적어보세요" required><button>추가</button></form><ul></ul><small>메모는 이 브라우저에 저장됩니다.</small></article><article><h2>동시 영상 재생</h2><video muted loop controls playsinline src="/video.mp4"></video><small>1080p60 테스트 영상 · 로컬 재생</small></article></section><p>VS Code에서 <code>src/message.ts</code>를 수정하고 저장하면 제목이 바뀝니다.</p></main>
<script type="module">
const el=document.querySelector('#message');window.devLab={updates:0,updatedAt:0};
async function refresh(){try{const {message}=await import('/message.js?t='+Date.now());el.textContent=message;window.devLab.updates++;window.devLab.updatedAt=performance.now();document.querySelector('#state').textContent='개발 서버 연결됨 · 저장한 변경 반영 완료'}catch(e){document.querySelector('#state').textContent='코드를 확인하세요: '+e.message}}
function connect(){const ws=new WebSocket(`ws://${location.host}/live`);ws.onopen=refresh;ws.onmessage=refresh;ws.onclose=()=>{document.querySelector('#state').textContent='재연결 중';setTimeout(connect,1000)}}connect();
let tasks=JSON.parse(localStorage.getItem('dev-lab-tasks')||'[]');function render(){const ul=document.querySelector('ul');ul.replaceChildren();tasks.forEach((text,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.textContent='완료';b.onclick=()=>{tasks.splice(i,1);save()};li.append(document.createTextNode(text+' '),b);ul.append(li)})}function save(){localStorage.setItem('dev-lab-tasks',JSON.stringify(tasks));render()}document.querySelector('form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#task');tasks.push(input.value);input.value='';save()};render();
</script></html>
