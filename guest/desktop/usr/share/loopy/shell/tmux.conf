
# Minimal Tmux Status Configuration
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

unbind C-b
unbind %
unbind '"'
unbind l

set-option -g prefix C-a
bind-key C-a send-prefix

# MoveWindow
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split Windows
bind | split-window -h
bind - split-window -v

# 새 창은 맨 뒤가 아니라 현재 창 바로 뒤에 생성
bind c new-window -a

# bind C-w swap-pane -s :. -t 0 \; select-pane -t 0

# 창 번호를 항상 1부터 순서대로 유지 (창을 닫으면 자동 재번호) → Cmd+N = N번째 창
set -g base-index 1
set -g renumber-windows on

# Move Windows
bind 1 selectw -t:1
bind 2 selectw -t:2
bind 3 selectw -t:3
bind 4 selectw -t:4
bind 5 selectw -t:5
bind 6 selectw -t:6
bind 7 selectw -t:7
bind 8 selectw -t:8
bind 9 selectw -t:9
bind 0 selectw -t:10

bind -n M-1 select-window -t:1
bind -n M-2 select-window -t:2
bind -n M-3 select-window -t:3
bind -n M-4 select-window -t:4
bind -n M-5 select-window -t:5
bind -n M-6 select-window -t:6
bind -n M-7 select-window -t:7
bind -n M-8 select-window -t:8
bind -n M-9 select-window -t:9
bind -n M-0 select-window -t:10

set -g mouse on
set -g xterm-keys on
set -g extended-keys always
set -g extended-keys-format csi-u
set -g terminal-features[0] xterm-ghostty:clipboard:ccolour:cstyle:focus:title:extkeys
set -g terminal-features[1] xterm*:clipboard:ccolour:cstyle:focus:title
set -g terminal-features[2] screen*:title
set -g terminal-features[3] rxvt*:ignorefkeys
set -sg escape-time 0
set -g focus-events on

# 마우스 스크롤 동작 개선:
# - vim/less 같은 앱에서는 휠 이벤트를 앱으로 전달
# - 일반 셸에서는 copy-mode로 스크롤 후, 바닥으로 내리면 자동 해제
bind -n WheelUpPane if-shell -F -t= "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n WheelDownPane if-shell -F -t= "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "select-pane -t= \; send-keys -M"
bind -T copy-mode-vi WheelUpPane select-pane -t= \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane -t= \; send-keys -X -N 5 scroll-down \; if-shell -F "#{==:#{scroll_position},0}" "send-keys -X cancel"
# 마우스 드래그 해제 시 자동 복사 방지 (선택만 유지)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection

# to close the front window through its AppleScript command.
bind -n M-w if-shell -F '#{m/r:^(nvim|vim|view)$,#{pane_current_command}}' 'send-keys M-w' 'confirm-before -p "현재 tmux 창을 닫을까요? (y/n)" kill-window'

# 이미지 미리보기를 위한 설정 (Yazi, Neovim image.nvim 등)
set -gq allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g visual-activity off

# Vi 모드 (복사 모드에서 j/k 스크롤)
setw -g mode-keys vi


set -g window-style "bg=default"
set -g window-active-style "bg=default"
set -g status-style "bg=default"
set -g message-style "bg=default"
setw -g window-status-activity-style "default"
setw -g window-status-bell-style "default"
# 복사 모드 선택 영역은 투명 배경에서도 확실히 보이도록 고정 색상 사용
set -g mode-style "fg=#0B1016,bg=#8FB6FF"
set -g copy-mode-match-style "fg=#0B1016,bg=#F4D35E"
set -g copy-mode-current-match-style "fg=#0B1016,bg=#FFB703"
set -g pane-border-style "bg=default"
set -g pane-active-border-style "bg=default"

# 창 라벨(예: 2:node)은 색 블록으로 명확하게 표시
set -g window-status-format "#[fg=#D1D9EC]#[bg=#D1D9EC,fg=#2A2F36] #I:#W #[fg=#D1D9EC,bg=default]"
set -g window-status-current-format "#[fg=#7197E6]#[bg=#688EDD,fg=#0B1016,bold] #I:#W #[fg=#7197E6,bg=default]"
set -g default-shell /bin/zsh
set -g terminal-features[4] foot*:clipboard:ccolour:cstyle:focus:title:extkeys
