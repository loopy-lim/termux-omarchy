// Source-build validation only. The loader patch uses public certificate metadata.
// Do not run APK signing or use private keys.
allprojects { p ->
    p.afterEvaluate {
        if (p.path == ':lorie-app') {
            p.android.buildTypes.configureEach { signingConfig = null }
            def buildVersion = p.findProperty('termuxOmarchyBuildVersion')
            if (buildVersion == null || !(buildVersion ==~ /[A-Za-z0-9._-]+/))
                throw new GradleException('Explicit source build version required')
            p.android.defaultConfig.versionName = buildVersion
        }
        if (p.path == ':lorie') {
            def buildVersion = p.findProperty('termuxOmarchyBuildVersion')
            if (buildVersion == null || !(buildVersion ==~ /[A-Za-z0-9._-]+/))
                throw new GradleException('Explicit source build version required')
            p.android.defaultConfig.buildConfigField('String', 'VERSION_NAME', '"' + buildVersion + '"')
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name ==~ /(?i)(sign|validateSigning).*/ })
        throw new GradleException('Signing tasks are forbidden during source-build validation')
}
