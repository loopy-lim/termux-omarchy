// Read the exact application runtime artifacts; no build or signing task runs.
import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    rootProject.tasks.register('termuxOmarchyRuntimeDependencies') {
        doLast {
            def output = rootProject.findProperty('termuxOmarchyRuntimeOutput')
            if (output == null) throw new GradleException('Explicit runtime report output required')
            def rows = []
            [':lorie-app': 'sharedUidDebugRuntimeClasspath', ':shell-loader': 'debugRuntimeClasspath'].each { path, name ->
                def runtime = rootProject.project(path).configurations.getByName(name)
                def external = runtime.incoming.artifactView {
                    componentFilter { id -> id instanceof ModuleComponentIdentifier }
                }
                external.artifacts.artifacts.each { artifact ->
                    def id = artifact.id.componentIdentifier
                    rows.add([group: id.group, artifact: id.module, version: id.version,
                              configuration: path + ':' + name,
                              extension: artifact.file.name.tokenize('.').last(),
                              sha256: MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString(),
                              bytes: artifact.file.length()])
                }
            }
            new File(output.toString()).text = JsonOutput.prettyPrint(JsonOutput.toJson(rows.sort {
                a, b -> "${a.group}:${a.artifact}:${a.version}" <=> "${b.group}:${b.artifact}:${b.version}"
            })) + '\n'
        }
    }
}
